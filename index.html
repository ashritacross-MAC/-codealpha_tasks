<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #3b0a0a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(20, 20, 30, 0.96);
            border: 1px solid #ef4444;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #d4d4d8;
            margin-bottom: 30px;
        }

        .languages {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language-box {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #52525b;
            background: #27272a;
            color: white;
            font-size: 16px;
        }

        textarea {
            height: 160px;
            resize: vertical;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ef4444;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #27272a;
            border-radius: 12px;
            min-height: 100px;
        }

        .result h3 {
            margin-top: 0;
            color: #f87171;
        }

        #translation {
            font-size: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            .languages {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 AI Language Translator</h1>

    <p class="subtitle">
        Translate text between multiple languages using an AI-powered translation service.
    </p>

    <div class="languages">

        <div class="language-box">
            <label for="source">Source Language</label>

            <select id="source">
                <option value="auto">Auto Detect</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="ta">Tamil</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
            </select>
        </div>

        <div class="language-box">
            <label for="target">Target Language</label>

            <select id="target">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="ta">Tamil</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
            </select>
        </div>

    </div>

    <label for="text">Enter Text</label>

    <textarea
        id="text"
        placeholder="Type the text you want to translate..."
    ></textarea>

    <button onclick="translateText()">
        🔄 Translate
    </button>

    <div class="result">

        <h3>Translation</h3>

        <div id="translation">
            Your translated text will appear here.
        </div>

    </div>

</div>

<script>

async function translateText() {

    const text = document.getElementById("text").value.trim();
    const source = document.getElementById("source").value;
    const target = document.getElementById("target").value;
    const result = document.getElementById("translation");

    if (!text) {
        result.innerHTML = "⚠️ Please enter some text first.";
        return;
    }

    result.innerHTML = "⏳ Translating...";

    try {

        const response = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text,
                source: source,
                target: target
            })

        });

        const data = await response.json();

        if (data.error) {
            result.innerHTML = "❌ " + data.error;
        } else {
            result.innerHTML = data.translation;
        }

    } catch (error) {

        result.innerHTML =
            "❌ Something went wrong. Please check your connection.";

    }
}

</script>

</body>
</html>
